# =============================================================================
# All project parameters in one place.
# build_dataset.py and the training scripts read everything from here.
# =============================================================================

# ----- Output paths (auto-created) -----
images_dir:  "data/images"
labels_csv:  "data/labels.csv"
qa_jsonl:    "data/qa_pairs.jsonl"

# ----- Per-image signal parameters -----
n_symbols:   2048           # IQ samples per constellation image
image_size:  224            # output PNG is image_size x image_size
view_limit:  2.5            # plot range in normalized energy units
log_scale:   true           # log histogram density (recommended)

# ----- Modulation schemes (all 16 from [R2]) -----
modulations:
  - 4-ASK
  - 8-ASK
  - BPSK
  - QPSK
  - 4-HQAM
  - 16-HQAM
  - 64-HQAM
  - 16-QAM
  - 32-QAM
  - 64-QAM
  - 128-QAM
  - 256-QAM
  - 16-APSK
  - 32-APSK
  - 64-APSK
  - 128-APSK

# ----- SNR bins (dB). One bin is reserved as held-out for generalization. -----
snr_bins_db:
  low:      [0, 5]
  low_mid:  [5, 10]
  mid:      [10, 15]
  high_mid: [15, 20]
  high:     [20, 30]
held_out_snr_bin: "low_mid"

# ----- Phase noise severity (std in degrees) -----
phase_noise_deg:
  none:   0.0
  mild:   2.0
  severe: 6.0

# ----- IQ imbalance severity (amplitude eps, phase psi in degrees) -----
iq_imbalance:
  none:   { eps: 0.00, psi_deg: 0.0 }
  mild:   { eps: 0.05, psi_deg: 2.0 }
  severe: { eps: 0.15, psi_deg: 8.0 }

# ----- Optional CW jamming -----
jamming_enable:        true
jamming_probability:   0.25
jamming_sir_range_db:  [5, 15]
jamming_freq_range:    [-0.4, 0.4]

# ----- Dataset size & split -----
samples_per_combination: 5
seed: 42
split:
  train: 0.70
  val:   0.15
  test:  0.15
